<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#sky)"/>
  <rect y="160" width="400" height="80" fill="#15803d"/>
  <!-- Building 7 facade -->
  <rect x="50" y="60" width="300" height="110" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" rx="4"/>
  <!-- Windows rows -->
  <g fill="#38bdf8" stroke="#0284c7">
    <!-- Floor 3 -->
    <rect x="80" y="75" width="40" height="20" rx="2"/><rect x="140" y="75" width="40" height="20" rx="2"/><rect x="220" y="75" width="40" height="20" rx="2"/><rect x="280" y="75" width="40" height="20" rx="2"/>
    <!-- Floor 2 -->
    <rect x="80" y="105" width="40" height="20" rx="2"/><rect x="140" y="105" width="40" height="20" rx="2"/><rect x="220" y="105" width="40" height="20" rx="2"/><rect x="280" y="105" width="40" height="20" rx="2"/>
  </g>
  <!-- Entrance Glass Door -->
  <rect x="180" y="130" width="40" height="40" fill="#006837" rx="2"/>
  <text x="200" y="50" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="extrabold" font-size="20">EDIFICIO 7</text>
  <rect x="20" y="20" width="160" height="30" fill="#0f172a" rx="4" opacity="0.9"/>
  <text x="30" y="40" fill="#f59e0b" font-family="sans-serif" font-weight="bold" font-size="12">📷 FOTO DE REFERENCIA</text>
</svg>
