<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="wall" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <!-- Sky background -->
  <rect width="400" height="240" fill="url(#sky)"/>
  <!-- Grass -->
  <rect y="160" width="400" height="80" fill="#15803d"/>
  <!-- Arch Entrance -->
  <rect x="100" y="70" width="200" height="100" fill="url(#wall)" rx="6"/>
  <rect x="130" y="90" width="140" height="80" fill="#006837" rx="4"/>
  <path d="M 130 90 Q 200 60 270 90 L 270 170 L 130 170 Z" fill="#004d28"/>
  <text x="200" y="82" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14">FIME UANL</text>
  <text x="200" y="125" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="600" font-size="16">ENTRADA PRINCIPAL</text>
  <rect x="175" y="135" width="50" height="35" fill="#38bdf8" opacity="0.8"/>
  <!-- Sign badge -->
  <rect x="20" y="20" width="160" height="30" fill="#0f172a" rx="4" opacity="0.9"/>
  <text x="30" y="40" fill="#f59e0b" font-family="sans-serif" font-weight="bold" font-size="12">📷 FOTO DE REFERENCIA</text>
</svg>
